name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets --features dsa,test-util -- -D warnings
      # The OpenSSH tests fail rather than skip in CI when a tool is
      # missing; say up front which OpenSSH they will drive.
      - name: OpenSSH
        if: runner.os != 'Windows'
        run: |
          ssh -V
          command -v ssh-add ssh-agent ssh-keygen
      # On Windows, Windows' own OpenSSH, whose ssh-add speaks named pipes.
      - name: Windows OpenSSH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\OpenSSH\ssh-add.exe" -V
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Test
        run: cargo test --features dsa
        env:
          RUSTFLAGS: ""
          # Longer than the default 750 ms, so races have time to show.
          # A failure prints the STRESS_SEED that reproduces it.
          STRESS_MS: "5000"
      # The example asserts its own results; it needs UnixStream::pair.
      - name: Self-checking example
        if: runner.os != 'Windows'
        run: cargo run --example in-process
        env:
          RUSTFLAGS: ""

  msrv:
    name: minimum Rust version (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.88"
      - name: Check
        run: cargo check --all-targets --features dsa,test-util
      - name: Test
        run: cargo test --features dsa
        env:
          RUSTFLAGS: ""

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Package
        run: cargo package --locked
      - name: Docs
        run: cargo doc --no-deps --features dsa
        env:
          RUSTDOCFLAGS: -D warnings
