[package]
name = "ssh-agent-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/rustafariandev/ssh-agent-kit"
documentation = "https://docs.rs/ssh-agent-kit"
description = "A framework for building custom SSH agents: the OpenSSH agent protocol, with pluggable key backends, smartcard providers, policy and extensions"
keywords = ["ssh", "ssh-agent", "agent", "framework"]
categories = ["authentication", "cryptography", "network-programming"]
readme = "README.md"
include = [
    "/src",
    "/examples",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[package.metadata.docs.rs]
features = ["dsa"]

[features]
default = []
# Accept plain DSA (`ssh-dss`) keys with `ssh-add FILE`. Off by default:
# OpenSSH disabled DSA in 9.8 and removed it in 10.0.
dsa = ["ssh-key/dsa"]
# Test doubles (`testing`): a recording confirm prompt and an in-memory
# backend, for testing agents built on this crate.
test-util = []

[dependencies]
ssh-key = { version = "0.6.7", features = ["ed25519", "p256", "p384", "p521", "rsa"] }
ssh-encoding = { version = "0.2", features = ["base64"] }
signature = "2"
sha2 = { version = "0.10", features = ["oid"] }
rsa = "0.9"
thiserror = "2"
tracing = "0.1"
nix = { version = "0.30", features = ["fs", "user", "socket"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
arc-swap = "1"

[dev-dependencies]
tempfile = "3"
hex = "0.4"
ed25519-dalek = "2"
p256 = { version = "0.13", features = ["ecdsa"] }

[lints.clippy]
all = "warn"
